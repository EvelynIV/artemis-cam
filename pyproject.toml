[project]
name = "artemis-cam"
version = "0.1.0"
description = ""
authors = [
    {name = "migo",email = "1695587905@qq.com"}
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (<2.3)",
    "aiortc (>=1.14.0,<2.0.0)",
    "grpcio (>=1.78.0,<2.0.0)",
    "protobuf (>=6.31.1,<7.0.0)",
    "typer (>=0.16.1,<0.17.0)"
]

[tool.poetry]
packages = [{include = "artemis_cam", from = "src"}]

[project.optional-dependencies]
codegen = [
    "grpcio-tools (>=1.78.0,<2.0.0)"
]
demo = [
    "opencv-python (>=4.13.0,<5.0.0)"
]
gstreamer = [
    "PyGObject (>=3.48.0)"
]
[[tool.poetry.source]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
